# vim:ft=tmux

## name: Bluloco Light
## author: Umut Topuzoğlu
## license: LGPL-3.0
## upstream: https://github.com/uloco/bluloco.nvim/blob/main/extra/tmux/.config/tmux/bluloco-light.conf

## blurb: A fancy and sophisticated light designer color theme

#: Base colors

# bg        #F9F9F9
# fg        #383A42
# dim fg    #A0A1A7
# status bg #EDEDEE
# border    #DEE1E3
# primary   #0099E1
# blue      #275FE4
# green     #23974A
# yellow    #C5A332
# red       #D52753
# purple    #823FF1
# selection #D2ECFF

#: Status bar

set -g status-style "bg=#EDEDEE,fg=#383A42"
set -g status-left-style "bg=#EDEDEE,fg=#383A42"
set -g status-right-style "bg=#EDEDEE,fg=#383A42"

#: Windows

set -g window-status-style "bg=default,fg=#A0A1A7"
set -g window-status-current-style "bg=#0099E1,fg=#F9F9F9,bold"
set -g window-status-last-style "bg=default,fg=#0099E1"
set -g window-status-activity-style "bg=default,fg=#C5A332"
set -g window-status-bell-style "bg=default,fg=#D52753,blink,bold"

#: Panes

set -g pane-border-style "fg=#DEE1E3"
set -g pane-active-border-style "fg=#0099E1"
set -g display-panes-colour "#A0A1A7"
set -g display-panes-active-colour "#0099E1"

#: Messages / command prompt

set -g message-style "bg=#C5A332,fg=#F9F9F9,bold"
set -g message-command-style "bg=#F9F9F9,fg=#C5A332,bold"

#: Copy mode / clock

set -g mode-style "bg=#D2ECFF,fg=#383A42"
set -g clock-mode-colour "#0099E1"

%if #{>=:#{version},3.2}
set -g copy-mode-match-style "bg=#D2ECFF,fg=#383A42"
set -g copy-mode-current-match-style "bg=#0099E1,fg=#F9F9F9,bold"
set -g copy-mode-mark-style "bg=#823FF1,fg=#F9F9F9,bold"
%endif

#: Optional status bar content
#: Uncomment to use, or keep your own status-left/status-right formats.

# set -g status-left  " #S "
# set -g status-right " %Y-%m-%d %H:%M "
