# vim:ft=tmux

## name: Bluloco Dark
## author: Umut Topuzoğlu
## license: LGPL-3.0
## upstream: https://github.com/uloco/bluloco.nvim/blob/main/extra/tmux/.config/tmux/bluloco-dark.conf

## blurb: A fancy and sophisticated dark designer color theme

#: Base colors

# bg        #282C34
# fg        #ABB2BF
# dim fg    #636D83
# status bg #2D333E
# border    #384252
# primary   #3691FF
# blue      #10B1FE
# green     #3FC56B
# yellow    #F9C859
# red       #FF6480
# purple    #9F7EFE
# selection #274670

#: Status bar

set -g status-style "bg=#2D333E,fg=#ABB2BF"
set -g status-left-style "bg=#2D333E,fg=#ABB2BF"
set -g status-right-style "bg=#2D333E,fg=#ABB2BF"

#: Windows

set -g window-status-style "bg=default,fg=#636D83"
set -g window-status-current-style "bg=#3691FF,fg=#282C34,bold"
set -g window-status-last-style "bg=default,fg=#3691FF"
set -g window-status-activity-style "bg=default,fg=#F9C859"
set -g window-status-bell-style "bg=default,fg=#FF6480,blink,bold"

#: Panes

set -g pane-border-style "fg=#384252"
set -g pane-active-border-style "fg=#3691FF"
set -g display-panes-colour "#636D83"
set -g display-panes-active-colour "#3691FF"

#: Messages / command prompt

set -g message-style "bg=#F9C859,fg=#282C34,bold"
set -g message-command-style "bg=#282C34,fg=#F9C859,bold"

#: Copy mode / clock

set -g mode-style "bg=#274670,fg=#ABB2BF"
set -g clock-mode-colour "#3691FF"

%if #{>=:#{version},3.2}
set -g copy-mode-match-style "bg=#274670,fg=#ABB2BF"
set -g copy-mode-current-match-style "bg=#3691FF,fg=#282C34,bold"
set -g copy-mode-mark-style "bg=#9F7EFE,fg=#282C34,bold"
%endif

#: Optional status bar content
#: Uncomment to use, or keep your own status-left/status-right formats.

# set -g status-left  " #S "
# set -g status-right " %Y-%m-%d %H:%M "
