# vim:ft=tmux

## name: Bluloco (auto light/dark)
## author: Umut Topuzoğlu
## license: LGPL-3.0
## upstream: https://github.com/uloco/bluloco.nvim/blob/main/extra/tmux/.config/tmux/bluloco.conf

## blurb: Sources bluloco-light.conf or bluloco-dark.conf depending on $BLULOCO_STYLE.
## Defaults to dark. See extra/tmux/README.md for how to toggle this at runtime.

if-shell '[ "$BLULOCO_STYLE" = "light" ]' \
  'source-file ~/.config/tmux/bluloco-light.conf' \
  'source-file ~/.config/tmux/bluloco-dark.conf'
